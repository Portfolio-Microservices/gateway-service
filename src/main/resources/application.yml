server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      forwarded:
        enabled: true
      x-forwarded:
        enabled: true
        for-enabled: true
        host-append: true
        port-append: true
        proto-append: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      enabled: true